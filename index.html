<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCaisse | Inscription</title>
    <link rel="shortcut icon" href="./photos/Fond Supermarché Dépanneur Disposition Des Produits Environnementaux Matériel D Achat Fond, Supermarché, Affiche, Promotion Image de Fond Pour le Téléchargement Gratuit - Pngtree.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="./src/output.css">
    <script src="main.js" defer></script>
</head>
<body class="page-authentification">
  <div class="fond-authentification" aria-hidden="true"></div>
  
  <!-- Connexion -->
  <section id="login-section" class="border p-4 w-2/3 sm:w-1/3 sm:h-4/5 rounded-lg flex flex-col items-center justify-center z-10 transition-all duration-500">
    <div class="w-full h-3/4 relative z-10 flex flex-col justify-center items-center">
      <img class="w-24 h-24 rounded-full mb-4" src="./photos/logo.jpg" alt="Logo">
      <div>
        <h1 class="font-bold text-3xl"> LOGIN</h1>
        <!-- <p class="text-2xl">Bienvenue</p> -->
      </div>
      <form class="flex flex-col items-center w-full mt-4">
        <!-- <label for="login-email" class="text-gray-200 mb-1">Email</label> -->
        <input id="login-email" class="bg-white text-gray-700 m-2 py-2 px-3 rounded-2xl outline-0 w-3/4" type="email" placeholder="Entrez votre email" required>
        <!-- <label for="login-password" class="text-gray-200 mb-1">Mot de passe</label> -->
        <input id="login-password" class="bg-white text-gray-700 m-2 py-2 px-3 rounded-2xl outline-0 w-3/4" type="password" placeholder="Entrez votre mot de passe" required>
        <button id="login" type="button" class="bg-blue-600 text-white px-6 py-2 mt-5 rounded-2xl cursor-pointer hover:bg-blue-700 transition">LOGIN</button>
        <h1 class="underline cursor-pointer mt-4 text-blue-300 hover:text-blue-500" id="show-signup">Créer un compte</h1>
      </form>
    </div>
    <div id="inscription_reussi" class="interdit bg-white rounded absolute top-130 hidden  sm:w-1/4">
      <p class="text-center text-red-600 p-2 ">Email ou mot de passe incorrect ❌</p>
    </div>
  </section>

  <!-- Inscription -->
  <section id="signup-section" class="signup-section border p-3 w-2/3 sm:w-1/3 sm:h-4/5 rounded-lg items-center justify-center z-10 transition-all duration-500 hidden">
    <div class="w-full h-3/4 relative z-10 flex flex-col justify-center items-center">
      <img class="w-24 h-24 rounded-full mb-4" src="./photos/logo.jpg" alt="Logo">
      <div>
        <h1 class="font-bold text-3xl">INSCRIPTION</h1>
        <!-- <p class="text-2xl">Bienvenue</p> -->
      </div>
      <form class="flex flex-col items-center w-full mt-4">
        <input type="text" placeholder="Entrez votre nom d'utilisateur" id="nom_utilisateur" class="bg-white text-gray-700 m-2 py-2 px-3 rounded-2xl outline-0 w-3/4" autocomplete="name" required>
        <input id="signup-email" class="bg-white text-gray-700 m-2 py-2 px-3 rounded-2xl outline-0 w-3/4" type="email" placeholder="Entrez votre email" autocomplete="email" required>
        <input id="signup-password" class="bg-white text-gray-700 m-2 py-2 px-3 rounded-2xl outline-0 w-3/4" type="password" placeholder="Entrez votre mot de passe" autocomplete="new-password" required>
        <button id="Signup" type="button" class="bg-blue-600 text-white px-6 py-2 mt-5 rounded-2xl cursor-pointer hover:bg-blue-700 transition">S'INSCRIRE</button>
        <button id="show-login" type="button" class="underline cursor-pointer mt-4 text-blue-300 hover:text-blue-500">Déjà un compte ? Connexion</button>
      </form>
    <div id="utilisateur_existe" class="interdit bg-white rounded absolute top-130 hidden w-2/3 sm:mr-0 mr-7 sm:w-1/4" role="alert">
      <p class="text-center text-red-600 p-2">Utilisateur existe ❌</p>
    </div>
  </section>
</body>
</html>
